# Publishes the STATIC site to GitHub Pages after tests pass. The FastAPI backend (contact form,
# AI assistant) is deployed separately (see README). Set the repository variable
# PORTFOLIO_API_BASE (Settings > Secrets and variables > Actions > Variables) to its URL; leave it
# empty and the site simply shows the assistant/contact form as unavailable with a mailto fallback.
name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements-dev.txt }
      - run: pip install -r backend/requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static site
        env:
          API_BASE: ${{ vars.PORTFOLIO_API_BASE }}
        run: |
          mkdir _site && cp -r index.html 404.html assets _site/ && touch _site/.nojekyll
          sed -i "s|apiBase: \"\"|apiBase: \"${API_BASE}\"|" _site/assets/js/config.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
